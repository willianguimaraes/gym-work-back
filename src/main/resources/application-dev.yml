# Desenvolvimento local: PostgreSQL e Mailpit do docker-compose.yml.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gymwork}
    username: ${DB_USERNAME:gymwork}
    password: ${DB_PASSWORD:gymwork}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-at-least-32-chars}
  auth:
    # Em dev o app pode ser aberto no celular via http://<ip-do-pc>, onde cookies Secure não funcionam
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    local-dir: ${STORAGE_DIR:./data/uploads}
    url-secret: ${STORAGE_URL_SECRET:dev-only-storage-secret-change-me-32-chars}

logging:
  level:
    com.gymwork: DEBUG
