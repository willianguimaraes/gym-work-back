# Configuração comum a todos os ambientes.
# Valores sem padrão (${VAR}) são obrigatórios em produção; o perfil "dev" fornece padrões locais.
spring:
  application:
    name: gym-work-api
  profiles:
    default: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      # carrega coleções (ex.: músculos secundários) em lote, evitando N+1 nas listagens
      hibernate.default_batch_fetch_size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  web:
    locale: pt_BR
    locale-resolver: fixed
  servlet:
    multipart:
      # fotos de evolução: até 10 MB por arquivo
      max-file-size: 10MB
      max-request-size: 11MB
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:PT15M}
    issuer: gym-work-api
  auth:
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:P30D}
    # Tolerância para duas abas renovando ao mesmo tempo antes de tratar como roubo de token
    refresh-reuse-grace: PT10S
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    password-reset-ttl: PT30M
    frontend-url: ${FRONTEND_URL}
  mail:
    from: ${MAIL_FROM:Gym Work <no-reply@gymwork.local>}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  storage:
    # pasta privada das fotos (não é servida diretamente; o acesso é por URL assinada)
    local-dir: ${STORAGE_DIR}
    url-secret: ${STORAGE_URL_SECRET}
    url-ttl: PT5M

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
