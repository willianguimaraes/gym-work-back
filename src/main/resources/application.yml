spring:
  application:
    name: gym-work-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gymwork}
    username: ${DB_USERNAME:gymwork}
    password: ${DB_PASSWORD:gymwork}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    # Em produção, defina JWT_SECRET com no mínimo 32 caracteres aleatórios.
    secret: ${JWT_SECRET:dev-only-secret-change-me-at-least-32-chars}
    expiration: ${JWT_EXPIRATION:PT8H}
    issuer: gym-work-api
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
