# Serviços de apoio para desenvolvimento local. Credenciais apenas para dev.
services:
  postgres:
    image: postgres:17-alpine
    container_name: gymwork-postgres
    environment:
      POSTGRES_DB: gymwork
      POSTGRES_USER: gymwork
      POSTGRES_PASSWORD: gymwork
    ports:
      - "5432:5432"
    volumes:
      - gymwork-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymwork -d gymwork"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Captura os e-mails enviados (recuperação de senha). Interface em http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: gymwork-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  gymwork-pgdata:
